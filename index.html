<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時文字雲</title>
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 24px 16px 12px;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .input-area {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      flex-wrap: wrap;
    }

    .input-area input {
      padding: 10px 16px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      width: min(320px, 100%);
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #60a5fa;
    }

    .input-area input::placeholder {
      color: #64748b;
    }

    .input-area button {
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .input-area button:hover { opacity: 0.9; }
    .input-area button:active { transform: scale(0.97); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

    .cloud-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px 16px;
    }

    #cloud-canvas {
      border-radius: 16px;
      background: #1e293b;
      display: block;
    }

    .status {
      text-align: center;
      font-size: 0.8rem;
      color: #475569;
      padding: 8px 16px 16px;
    }

    .status span {
      color: #60a5fa;
      font-weight: 600;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e40af;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: transform 0.3s;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>即時文字雲</h1>
  <p>輸入你的關鍵字，與大家一起即時呈現</p>
</header>

<div class="input-area">
  <input type="text" id="word-input" placeholder="輸入關鍵字（如：創新、協作）" maxlength="20">
  <button id="submit-btn" onclick="submitWord()">送出</button>
</div>

<div class="cloud-wrap">
  <canvas id="cloud-canvas"></canvas>
</div>

<div class="status">
  即時更新中・目前共 <span id="word-count">0</span> 筆資料
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBEZzmk1X83gqmpx4kK3AvvmX7AuiMdqGQ",
    authDomain: "chungyi-study.firebaseapp.com",
    projectId: "chungyi-study",
    storageBucket: "chungyi-study.firebasestorage.app",
    messagingSenderId: "649577447046",
    appId: "1:649577447046:web:af96bffafdb26dac925b07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const col = collection(db, "wordcloud_words");

  // ── 畫布尺寸 ──
  const canvas = document.getElementById("cloud-canvas");
  function resize() {
    const w = Math.min(window.innerWidth - 32, 900);
    const h = Math.max(window.innerHeight - 220, 300);
    canvas.width = w;
    canvas.height = h;
  }
  resize();
  window.addEventListener("resize", () => { resize(); renderCloud(lastWords); });

  // ── 文字雲渲染 ──
  let lastWords = {};

  function renderCloud(freq) {
    lastWords = freq;
    const list = Object.entries(freq).map(([text, count]) => [text, count]);
    if (list.length === 0) return;

    const maxCount = Math.max(...list.map(([, c]) => c));
    const sized = list.map(([text, count]) => {
      const size = 20 + (count / maxCount) * (canvas.height / 3);
      return [text, size];
    });

    WordCloud(canvas, {
      list: sized,
      gridSize: Math.round(16 * canvas.width / 900),
      weightFactor: 1,
      fontFamily: "Noto Sans TC, Microsoft JhengHei, sans-serif",
      color: () => {
        const colors = ["#60a5fa","#a78bfa","#34d399","#fb923c","#f472b6","#facc15"];
        return colors[Math.floor(Math.random() * colors.length)];
      },
      rotateRatio: 0.3,
      backgroundColor: "#1e293b",
      drawOutOfBound: false,
      shuffle: true,
    });
  }

  // ── 即時監聽 Firestore ──
  onSnapshot(col, (snapshot) => {
    const freq = {};
    snapshot.forEach(doc => {
      const w = (doc.data().word || "").trim();
      if (w) freq[w] = (freq[w] || 0) + 1;
    });
    document.getElementById("word-count").textContent = snapshot.size;
    renderCloud(freq);
  });

  // ── 送出 ──
  window.submitWord = async function () {
    const input = document.getElementById("word-input");
    const btn = document.getElementById("submit-btn");
    const word = input.value.trim();
    if (!word) return;

    btn.disabled = true;
    try {
      await addDoc(col, { word, created_at: serverTimestamp() });
      input.value = "";
      showToast(`「${word}」已送出！`);
    } catch (e) {
      showToast("送出失敗，請稍後再試");
      console.error(e);
    }
    btn.disabled = false;
    input.focus();
  };

  document.getElementById("word-input").addEventListener("keydown", e => {
    if (e.key === "Enter") window.submitWord();
  });

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }
</script>
</body>
</html>
