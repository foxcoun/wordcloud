<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時文字雲</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 20px 16px 10px;
    }
    header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { margin-top: 4px; font-size: 0.85rem; color: #64748b; }

    .input-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
    }
    .input-row input {
      padding: 10px 16px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      width: min(340px, 70vw);
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #60a5fa; }
    .input-row input::placeholder { color: #475569; }
    .input-row button {
      padding: 10px 22px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .input-row button:hover { opacity: 0.88; }
    .input-row button:active { transform: scale(0.96); }
    .input-row button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── 主體兩欄 ── */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 12px;
      padding: 0 16px 16px;
    }
    @media (max-width: 700px) {
      .main { grid-template-columns: 1fr; }
    }

    /* ── 文字雲 ── */
    .cloud-panel {
      background: #1e293b;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      min-height: 320px;
    }
    #cloud-canvas { display: block; }
    .empty-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      font-size: 1rem;
      pointer-events: none;
    }

    /* ── 排行榜 ── */
    .rank-panel {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      overflow-y: auto;
    }
    .rank-panel h2 {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #0f172a;
    }
    .rank-no {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .rank-no.gold   { background: #fbbf24; color: #1c1917; }
    .rank-no.silver { background: #94a3b8; color: #1c1917; }
    .rank-no.bronze { background: #c2693a; color: white; }
    .rank-no.other  { background: #0f172a; color: #64748b; border: 1px solid #334155; }
    .rank-word { flex: 1; font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-bar-wrap { width: 48px; background: #0f172a; border-radius: 4px; height: 6px; overflow: hidden; flex-shrink: 0; }
    .rank-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#3b82f6,#8b5cf6); }
    .rank-count { font-size: 0.8rem; color: #94a3b8; width: 24px; text-align: right; flex-shrink: 0; }

    .status {
      text-align: center;
      font-size: 0.78rem;
      color: #334155;
      padding: 6px 0 12px;
    }
    .status span { color: #60a5fa; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1d4ed8;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: transform 0.3s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>即時文字雲</h1>
  <p>輸入關鍵字，即時與所有人一起呈現</p>
</header>

<div class="input-row">
  <input type="text" id="word-input" placeholder="輸入關鍵字（最多 20 字）" maxlength="20" autocomplete="off">
  <button id="submit-btn" onclick="submitWord()">送出</button>
</div>

<div class="main">
  <div class="cloud-panel" id="cloud-panel">
    <canvas id="cloud-canvas"></canvas>
    <div class="empty-hint" id="empty-hint">尚無資料，快來輸入第一個關鍵字！</div>
  </div>

  <div class="rank-panel">
    <h2>🏆 關鍵字排行榜</h2>
    <div id="rank-list"></div>
  </div>
</div>

<div class="status">即時更新中・目前共 <span id="word-count">0</span> 筆</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBEZzmk1X83gqmpx4kK3AvvmX7AuiMdqGQ",
  authDomain: "chungyi-study.firebaseapp.com",
  projectId: "chungyi-study",
  storageBucket: "chungyi-study.firebasestorage.app",
  messagingSenderId: "649577447046",
  appId: "1:649577447046:web:af96bffafdb26dac925b07"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const col = collection(db, "wordcloud_words");

const canvas = document.getElementById("cloud-canvas");
const panel  = document.getElementById("cloud-panel");
const hint   = document.getElementById("empty-hint");

function syncCanvasSize() {
  canvas.width  = panel.clientWidth;
  canvas.height = panel.clientHeight;
}

const COLORS = ["#60a5fa","#a78bfa","#34d399","#fb923c","#f472b6","#facc15","#38bdf8","#4ade80"];

let currentFreq = {};

function redraw() {
  syncCanvasSize();
  const entries = Object.entries(currentFreq);

  if (entries.length === 0) {
    hint.style.display = "flex";
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  hint.style.display = "none";

  const maxCount = Math.max(...entries.map(([, c]) => c));
  const minSize = 16;
  const maxSize = Math.max(48, Math.min(canvas.width, canvas.height) / 4);

  const list = entries
    .sort((a, b) => b[1] - a[1])
    .map(([word, count]) => {
      const ratio = count / maxCount;
      const size  = Math.round(minSize + ratio ** 0.55 * (maxSize - minSize));
      return [word, size];
    });

  WordCloud(canvas, {
    list,
    gridSize       : Math.max(4, Math.round(canvas.width / 100)),
    weightFactor   : 1,
    fontFamily     : "'Noto Sans TC', 'Microsoft JhengHei', sans-serif",
    color          : () => COLORS[Math.floor(Math.random() * COLORS.length)],
    rotateRatio    : 0.25,
    rotationSteps  : 2,
    backgroundColor: "#1e293b",
    drawOutOfBound : false,
    shuffle        : true,
    minSize        : 10,
  });
}

function renderRank(freq) {
  const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 20);
  const max = sorted[0]?.[1] || 1;
  const medals = ["gold", "silver", "bronze"];

  document.getElementById("rank-list").innerHTML = sorted.map(([word, count], i) => {
    const pct = Math.round((count / max) * 100);
    const cls = medals[i] ?? "other";
    return `<div class="rank-item">
      <div class="rank-no ${cls}">${i + 1}</div>
      <div class="rank-word" title="${word}">${word}</div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
      <div class="rank-count">${count}</div>
    </div>`;
  }).join("");
}

// 等畫面渲染完再做第一次 redraw
let firstDraw = true;

onSnapshot(col, (snapshot) => {
  const freq = {};
  snapshot.forEach(doc => {
    const w = (doc.data().word || "").trim();
    if (w) freq[w] = (freq[w] || 0) + 1;
  });
  currentFreq = freq;
  document.getElementById("word-count").textContent = snapshot.size;

  if (firstDraw) {
    // 等 layout 穩定
    requestAnimationFrame(() => { syncCanvasSize(); redraw(); });
    firstDraw = false;
  } else {
    redraw();
  }
  renderRank(freq);
});

window.addEventListener("resize", () => redraw());

window.submitWord = async function () {
  const input = document.getElementById("word-input");
  const btn   = document.getElementById("submit-btn");
  const word  = input.value.trim();
  if (!word) return;
  btn.disabled = true;
  try {
    await addDoc(col, { word, created_at: serverTimestamp() });
    input.value = "";
    showToast(`「${word}」已送出！`);
  } catch (e) {
    showToast("送出失敗，請稍後再試");
    console.error(e);
  }
  btn.disabled = false;
  input.focus();
};

document.getElementById("word-input").addEventListener("keydown", e => {
  if (e.key === "Enter") window.submitWord();
});

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
