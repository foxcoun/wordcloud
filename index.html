<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時文字雲</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header { text-align: center; padding: 20px 16px 8px; }
    header h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { margin-top: 4px; font-size: 0.85rem; color: #64748b; }

    /* ── Input ── */
    .input-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
    }
    .input-row input {
      padding: 10px 16px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      width: min(340px, 70vw);
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #60a5fa; }
    .input-row input::placeholder { color: #475569; }
    .input-row button {
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .input-row button:hover { opacity: 0.88; }
    .input-row button:active { transform: scale(0.96); }
    .input-row button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── 主體兩欄 ── */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 270px;
      gap: 12px;
      padding: 0 16px 16px;
      min-height: 0;
    }
    @media (max-width: 680px) {
      .main { grid-template-columns: 1fr; }
    }

    /* ── 文字雲 ── */
    .cloud-panel {
      background: #1e293b;
      border-radius: 16px;
      min-height: 340px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #cloud-words {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
      width: 100%;
    }
    .cloud-word {
      display: inline-block;
      font-weight: 700;
      line-height: 1.1;
      cursor: default;
      transition: transform 0.2s;
      user-select: none;
    }
    .cloud-word:hover { transform: scale(1.15); }
    .empty-hint { color: #334155; font-size: 1rem; text-align: center; }

    /* ── 排行榜 ── */
    .rank-panel {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      overflow-y: auto;
      max-height: 500px;
    }
    .rank-panel h2 {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #0f172a;
    }
    .medal {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700;
      flex-shrink: 0;
    }
    .medal-1 { background: #fbbf24; color: #1c1917; }
    .medal-2 { background: #94a3b8; color: #1c1917; }
    .medal-3 { background: #c2693a; color: #fff; }
    .medal-n { background: #0f172a; color: #475569; border: 1px solid #334155; }
    .rank-word { flex: 1; font-size: 0.92rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-bar-wrap { width: 52px; background: #0f172a; border-radius: 4px; height: 6px; overflow: hidden; flex-shrink: 0; }
    .rank-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.4s; }
    .rank-count { font-size: 0.8rem; color: #64748b; width: 26px; text-align: right; flex-shrink: 0; }

    /* ── Status ── */
    .status { text-align: center; font-size: 0.78rem; color: #334155; padding: 6px 0 12px; }
    .status span { color: #60a5fa; }

    /* ── 清除按鈕 ── */
    .clear-btn {
      display: block;
      margin: 0 auto 2px;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: transparent;
      color: #475569;
      font-size: 0.78rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .clear-btn:hover { color: #f87171; border-color: #f87171; }

    /* ── 密碼對話框 ── */
    .dialog-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .dialog-overlay.show { display: flex; }
    .dialog-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px 32px;
      width: min(360px, 90vw);
      text-align: center;
    }
    .dialog-box h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .dialog-box p  { font-size: 0.82rem; color: #64748b; margin-bottom: 16px; }
    .dialog-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .dialog-box input:focus { border-color: #f87171; }
    .dialog-box input.error { border-color: #f87171; animation: shake 0.3s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }
    .dialog-actions { display: flex; gap: 10px; }
    .dialog-actions button {
      flex: 1; padding: 10px; border-radius: 8px;
      border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    }
    .btn-cancel { background: #334155; color: #94a3b8; }
    .btn-confirm { background: linear-gradient(135deg,#ef4444,#b91c1c); color: #fff; }
    .btn-confirm:hover { opacity: 0.88; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1d4ed8; color: #fff;
      padding: 10px 20px; border-radius: 10px;
      font-size: 0.9rem; transition: transform 0.3s;
      pointer-events: none; z-index: 99;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>即時文字雲</h1>
  <p>輸入關鍵字，即時與所有人一起呈現</p>
</header>

<div class="input-row">
  <input id="word-input" type="text" placeholder="輸入關鍵字（最多 20 字）" maxlength="20" autocomplete="off">
  <button id="submit-btn" onclick="submitWord()">送出</button>
</div>

<div class="main">

  <!-- 文字雲 -->
  <div class="cloud-panel">
    <div id="cloud-words">
      <span class="empty-hint">尚無資料，快來輸入第一個關鍵字！</span>
    </div>
  </div>

  <!-- 排行榜 -->
  <div class="rank-panel">
    <h2>🏆 關鍵字排行榜</h2>
    <div id="rank-list"><p style="color:#334155;font-size:0.85rem;">尚無資料</p></div>
  </div>

</div>

<button class="clear-btn" onclick="openClearDialog()">🗑 全部清除</button>
<div class="status">即時更新中・目前共 <span id="word-count">0</span> 筆</div>
<div class="toast" id="toast"></div>

<!-- 密碼對話框 -->
<div class="dialog-overlay" id="dialog-overlay">
  <div class="dialog-box">
    <h3>🔐 老師驗證</h3>
    <p>請輸入管理密碼以清除所有資料</p>
    <input type="password" id="pw-input" placeholder="輸入密碼" autocomplete="off">
    <div class="dialog-actions">
      <button class="btn-cancel" onclick="closeClearDialog()">取消</button>
      <button class="btn-confirm" onclick="confirmClear()">確認清除</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, onSnapshot, serverTimestamp }
                             from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey           : "AIzaSyBEZzmk1X83gqmpx4kK3AvvmX7AuiMdqGQ",
  authDomain       : "chungyi-study.firebaseapp.com",
  projectId        : "chungyi-study",
  storageBucket    : "chungyi-study.firebasestorage.app",
  messagingSenderId: "649577447046",
  appId            : "1:649577447046:web:af96bffafdb26dac925b07"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const col = collection(db, "wordcloud_words");

const COLORS   = ["#60a5fa","#a78bfa","#34d399","#fb923c","#f472b6","#facc15","#38bdf8","#4ade80","#f87171"];
const ROTATES  = [-15, -10, -5, 0, 0, 0, 5, 10, 15];

// ── 文字雲（純 CSS） ──
function renderCloud(freq) {
  const wrap = document.getElementById("cloud-words");
  const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);

  if (sorted.length === 0) {
    wrap.innerHTML = '<span class="empty-hint">尚無資料，快來輸入第一個關鍵字！</span>';
    return;
  }

  const maxCount = sorted[0][1];
  const minPx = 16, maxPx = 72;

  wrap.innerHTML = sorted.map(([word, count], i) => {
    const ratio  = count / maxCount;
    const size   = Math.round(minPx + ratio ** 0.5 * (maxPx - minPx));
    const color  = COLORS[i % COLORS.length];
    const rotate = ROTATES[Math.floor(Math.random() * ROTATES.length)];
    return `<span class="cloud-word"
      style="font-size:${size}px;color:${color};transform:rotate(${rotate}deg)"
      title="${word} ×${count}">${word}</span>`;
  }).join("");
}

// ── 排行榜 ──
function renderRank(freq) {
  const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 20);
  const max    = sorted[0]?.[1] || 1;
  const medals = ["medal-1","medal-2","medal-3"];

  document.getElementById("rank-list").innerHTML = sorted.map(([word, count], i) => {
    const pct = Math.round((count / max) * 100);
    const cls = medals[i] ?? "medal-n";
    return `<div class="rank-item">
      <div class="medal ${cls}">${i + 1}</div>
      <div class="rank-word" title="${word}">${word}</div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
      <div class="rank-count">${count}</div>
    </div>`;
  }).join("");
}

// ── Firestore 即時監聽 ──
onSnapshot(col, (snapshot) => {
  const freq = {};
  snapshot.forEach(doc => {
    const w = (doc.data().word || "").trim();
    if (w) freq[w] = (freq[w] || 0) + 1;
  });
  document.getElementById("word-count").textContent = snapshot.size;
  renderCloud(freq);
  renderRank(freq);
});

// ── 送出 ──
window.submitWord = async function () {
  const input = document.getElementById("word-input");
  const btn   = document.getElementById("submit-btn");
  const word  = input.value.trim();
  if (!word) return;
  btn.disabled = true;
  try {
    await addDoc(col, { word, created_at: serverTimestamp() });
    input.value = "";
    toast(`「${word}」已送出！`);
  } catch (e) {
    toast("送出失敗，請稍後再試");
    console.error(e);
  }
  btn.disabled = false;
  input.focus();
};

document.getElementById("word-input").addEventListener("keydown", e => {
  if (e.key === "Enter") window.submitWord();
});

// ── 全部清除 ──
const PASSWORD = "全部清除";

window.openClearDialog = function () {
  document.getElementById("pw-input").value = "";
  document.getElementById("pw-input").classList.remove("error");
  document.getElementById("dialog-overlay").classList.add("show");
  setTimeout(() => document.getElementById("pw-input").focus(), 100);
};

window.closeClearDialog = function () {
  document.getElementById("dialog-overlay").classList.remove("show");
};

window.confirmClear = async function () {
  const pw = document.getElementById("pw-input").value;
  if (pw !== PASSWORD) {
    const input = document.getElementById("pw-input");
    input.classList.add("error");
    setTimeout(() => input.classList.remove("error"), 400);
    input.value = "";
    return;
  }
  closeClearDialog();
  try {
    const snap = await getDocs(col);
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
    toast("✅ 已清除所有資料");
  } catch (e) {
    toast("清除失敗，請稍後再試");
    console.error(e);
  }
};

// 按 Enter 確認、Esc 取消
document.getElementById("pw-input").addEventListener("keydown", e => {
  if (e.key === "Enter")  window.confirmClear();
  if (e.key === "Escape") window.closeClearDialog();
});

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}
</script>
</body>
</html>
